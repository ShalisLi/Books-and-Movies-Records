<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📚 Shalis的私人书影音单</title>
<style>
  :root{
    --bg:#F9FBFC; --surface:#FFFFFF; --border:#E3EBEF; --border-2:#EFF5F7;
    --text:#1C2B33; --text-sec:#7E93A0; --text-faint:#A9BAC4;
    --accent:#0C86AD; --accent-hover:#0A6E8E; --accent-soft:#EAF4F8; --accent-light:#7FB6CB;
    --green:#D8EAF2; --ink:#1C2B33; --on-green:#0F6E8C;
    --thead:#D8EAF2; --thead-text:#0F6E8C;
    --row-even:#FAFCFD; --row-hover:#F0F7FA;
    --gold:#E8A33D; --star-empty:#E2ECEF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ overflow-x:hidden; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-text-size-adjust:100%; }
  .container{ max-width:1280px; margin:0 auto; padding:24px 16px calc(60px + env(safe-area-inset-bottom)); }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:10px; }
  .brand h1{ font-size:24px; color:var(--ink); font-family:"Songti SC","STSong",serif; line-height:1.35; letter-spacing:1px; }
  .brand p{ color:var(--text-sec); font-size:13px; margin-top:6px; }
  .top-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .hint-text{ font-size:12px; color:var(--text-faint); margin:0 0 12px; }
  .toggle-btn{ padding:8px 18px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; }
  .toggle-btn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .panel{ display:none; margin-bottom:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(28,43,51,.05); }
  .panel.show{ display:block; }
  .add-panel-inner{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .input{ padding:9px 12px; border:1px solid var(--border); border-radius:9px; font-size:13px; font-family:inherit; outline:none; background:#fff; color:var(--text); transition:border .2s; }
  .input:focus{ border-color:var(--accent); }
  .input.title{ flex:1 1 170px; min-width:150px; }
  .input.author{ flex:0 1 130px; }
  .search-results{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .result-card{ display:flex; gap:12px; align-items:center; border:1px solid var(--border); border-radius:12px; padding:12px; background:#fff; }
  .result-cover{ width:50px; height:70px; border-radius:6px; overflow:hidden; flex-shrink:0; background:var(--border-2); display:flex; align-items:center; justify-content:center; }
  .result-cover img{ width:100%; height:100%; object-fit:cover; }
  .result-info{ flex:1; min-width:0; }
  .result-title{ font-size:14px; font-weight:700; color:var(--text); }
  .result-author{ font-size:12px; color:var(--text-sec); margin-top:2px; }
  .search-loading,.search-empty{ font-size:13px; color:var(--text-sec); padding:14px; text-align:center; line-height:1.7; }
  .cat-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-2); }
  .cat-item:last-child{ border-bottom:none; }
  .cat-color{ width:36px; height:30px; border:1px solid var(--border); border-radius:7px; cursor:pointer; background:transparent; padding:2px; }
  .cat-name{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; outline:none; background:#fff; color:var(--text); }
  .cat-name:focus{ border-color:var(--accent); }
  .cat-count{ font-size:12px; color:var(--text-sec); white-space:nowrap; min-width:44px; text-align:right; }
  .add-cat-btn{ margin-top:12px; padding:8px 16px; border-radius:99px; border:1px solid var(--border); background:#fff; color:var(--accent); font-size:13px; cursor:pointer; font-family:inherit; }
  .add-cat-btn:hover{ background:var(--accent-soft); }
  .layout{ display:flex; gap:20px; align-items:flex-start; }
  .leftcol{ width:250px; flex-shrink:0; position:sticky; top:24px; }
  .sidebar{ background:var(--green); border:1px solid var(--border); border-radius:18px; padding:18px 16px; display:flex; flex-direction:column; gap:14px; box-shadow:0 2px 10px rgba(28,43,51,.05); }
  .mode-switch{ display:flex; background:#fff; border:1px solid var(--border); border-radius:99px; padding:4px; gap:4px; }
  .mode-btn{ flex:1; padding:9px 12px; border:none; border-radius:99px; background:transparent; color:var(--text-sec); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; }
  .mode-btn.active{ background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(12,134,173,.3); }
  .side-stats{ display:flex; gap:12px; }
  .side-stat{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 10px; text-align:center; }
  .side-stat .num{ font-size:28px; font-weight:700; color:var(--accent); }
  .side-stat .label{ font-size:12px; color:var(--text-sec); margin-top:2px; }
  .side-progress{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .side-progress-label{ font-size:12px; color:var(--text-sec); margin-bottom:10px; display:flex; justify-content:space-between; }
  .side-progress-label b{ color:var(--accent); font-weight:700; }
  .progress-bar{ height:10px; background:#fff; border:1px solid var(--border); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; border-radius:99px; background:var(--accent); transition:width .5s ease; }
  .side-actions{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .main{ flex:1; min-width:0; width:100%; }
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:auto; box-shadow:0 2px 12px rgba(28,43,51,.05); max-height:72vh; width:100%; }
  table{ width:100%; border-collapse:collapse; min-width:920px; }
  thead th{ position:sticky; top:0; z-index:5; background:var(--thead); color:var(--thead-text); font-size:13px; font-weight:700; padding:12px 14px; text-align:left; white-space:nowrap; }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--border-2); vertical-align:middle; font-size:13px; }
  tbody tr:nth-child(even){ background:var(--row-even); }
  tbody tr:hover{ background:var(--row-hover); }
  tbody tr.dropped{ opacity:.5; }
  /* 表头筛选器：透明底，与表头同色 */
  .th-filter{ width:100%; padding:7px 28px 7px 12px; border:1px solid transparent; border-radius:8px; background-color:transparent; color:var(--thead-text); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; outline:none; -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3e%3cpath d='M1 1l4 4 4-4' stroke='%230F6E8C' stroke-width='1.5' fill='none' stroke-linecap='round'/%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right 10px center; }
  .th-filter:hover{ background-color:rgba(255,255,255,.5); border-color:var(--border); }
  .th-filter option{ color:var(--text); background:#fff; }
  .cat-select{ padding:6px 10px; border-radius:99px; border:1px solid; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; outline:none; min-width:104px; -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3e%3cpath d='M1 1l4 4 4-4' stroke='%237E93A0' stroke-width='1.5' fill='none' stroke-linecap='round'/%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right 10px center; padding-right:26px; }
  .cat-select option{ color:var(--text); background:#fff; }
  .book-cell{ display:flex; gap:12px; align-items:center; }
  .cover-thumb{ width:44px; height:62px; border-radius:6px; overflow:hidden; flex-shrink:0; cursor:pointer; box-shadow:0 1px 5px rgba(28,43,51,.15); background:var(--border-2); display:flex; align-items:center; justify-content:center; }
  .cover-thumb img{ width:100%; height:100%; object-fit:cover; }
  .cover-placeholder{ font-size:20px; }
  .book-info{ min-width:0; }
  .book-title{ font-size:15px; font-weight:700; font-family:"Songti SC","STSong",serif; color:var(--text); cursor:pointer; }
  .book-title:hover{ color:var(--accent); text-decoration:underline; }
  .book-author{ font-size:12px; color:var(--text-sec); margin-top:2px; }
  .status-select{ padding:6px 10px; border-radius:99px; border:1px solid; background:#fff; color:var(--text-sec); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; outline:none; -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3e%3cpath d='M1 1l4 4 4-4' stroke='%237E93A0' stroke-width='1.5' fill='none' stroke-linecap='round'/%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right 10px center; padding-right:26px; }
  .status-select.st-want{ background:#E0F2FE; color:#0369A1; border-color:#0369A140; }
  .status-select.st-reading{ background:#FEF3C7; color:#B45309; border-color:#B4530940; }
  .status-select.st-read{ background:#ECFDF5; color:#047857; border-color:#04785740; }
  .status-select.st-dropped{ background:#F3F4F6; color:#6B7280; border-color:#6B728040; }
  .stars{ display:flex; gap:2px; align-items:center; }
  .star{ font-size:20px; color:var(--star-empty); cursor:pointer; user-select:none; line-height:1; }
  .star.filled{ color:var(--gold); }
  .rating-num{ font-size:11px; color:var(--text-sec); margin-left:6px; white-space:nowrap; }
  .comment-box{ width:100%; min-width:170px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; font-family:inherit; resize:vertical; min-height:44px; background:#fff; color:var(--text); outline:none; }
  .save-hint{ font-size:10px; color:var(--text-faint); margin-top:3px; }
  .op-cell{ text-align:center; }
  .del-btn{ width:30px; height:30px; border:none; border-radius:8px; background:transparent; color:var(--text-faint); font-size:15px; cursor:pointer; line-height:1; }
  .del-btn:hover{ background:#fdecec; color:#e05c5c; }
  .tool-btn{ display:inline-block; padding:10px 18px; border-radius:99px; border:none; cursor:pointer; font-size:13px; font-family:inherit; transition:all .2s; text-align:center; }
  .tool-btn.primary{ background:var(--accent); color:#fff; }
  .tool-btn.primary:hover{ background:var(--accent-hover); }
  .tool-btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text-sec); }
  .tool-btn.ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .tool-btn.small{ padding:7px 14px; font-size:12px; }
  .tool-btn:disabled{ opacity:.6; cursor:not-allowed; }
  .sr-input{ position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  .empty-tip{ text-align:center; color:var(--text-faint); padding:40px; font-size:14px; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(28,43,51,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .modal-overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:18px; max-width:560px; width:100%; max-height:86vh; overflow:auto; padding:24px; }
  .modal-head{ display:flex; gap:18px; margin-bottom:16px; }
  .modal-cover{ width:118px; height:168px; border-radius:10px; overflow:hidden; background:var(--border-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .modal-cover img{ width:100%; height:100%; object-fit:cover; }
  .modal-cover .cover-placeholder{ font-size:40px; }
  .modal-title{ font-size:20px; font-family:"Songti SC","STSong",serif; color:var(--text); }
  .field-label{ font-size:12px; color:var(--text-sec); display:block; margin:10px 0 6px; }
  .author-input{ width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit; outline:none; background:#fff; color:var(--text); }
  .author-input:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .fetch-msg{ font-size:12px; color:var(--accent); margin-top:8px; min-height:16px; }
  .modal-foot{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .toast{ position:fixed; top:calc(env(safe-area-inset-top) + 16px); left:50%; transform:translateX(-50%); background:#1C2B33; color:#fff; padding:10px 22px; border-radius:99px; font-size:13px; z-index:300; opacity:0; pointer-events:none; transition:opacity .3s; max-width:88vw; }
  .toast.show{ opacity:1; }
  @media (max-width:860px){
    .layout{ flex-direction:column; }
    .leftcol{ width:100%; position:static; }
    .side-actions{ flex-direction:row; flex-wrap:wrap; }
    .side-actions .tool-btn{ flex:1; }
  }
  @media (max-width:700px){
    .container{ padding:16px 12px calc(40px + env(safe-area-inset-bottom)); }
    .topbar{ flex-direction:column; align-items:flex-start; }
    .input, .comment-box, .cat-name, .author-input{ font-size:16px; }
    .star{ font-size:24px; }
    .del-btn{ width:38px; height:38px; font-size:17px; }
    .main, .table-wrap, table, thead, tbody, tbody tr{ width:100%; box-sizing:border-box; }
    .table-wrap{ overflow:visible; max-height:none; box-shadow:none; border:none; background:transparent; }
    table{ min-width:0; }
    thead{ display:block; background:var(--thead); border:1px solid var(--border); border-radius:14px; padding:10px; margin-bottom:12px; }
    thead tr{ display:flex; gap:8px; }
    thead th{ position:static; background:transparent; padding:0; }
    thead th.th-f{ flex:1; }
    thead th.th-plain{ display:none; }
    tbody{ display:block; }
    tbody tr{ display:block; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 14px; margin-bottom:12px; }
    tbody tr:nth-child(even){ background:var(--surface); }
    tbody td{ display:flex; align-items:center; gap:10px; border:none; padding:7px 0; width:100%; }
    tbody td::before{ content:attr(data-label); font-size:11px; color:var(--text-sec); font-weight:700; width:40px; flex-shrink:0; }
    tbody td.no-label::before{ display:none; }
    td.td-comment{ flex-direction:column; align-items:stretch; gap:4px; }
    td.td-comment::before{ width:auto; }
    td.td-op{ justify-content:flex-end; }
    .comment-box{ min-height:56px; min-width:0; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      <h1 id="brand-title">Shalis</h1>
      <p>和你渡过的每一分每一秒</p>
    </div>
    <div class="top-actions">
      <button class="toggle-btn" id="add-toggle-btn" onclick="toggleAdd()">＋ 搜索 / 添加书籍</button>
      <button class="toggle-btn" onclick="toggleCatManager()">🏷 管理分类</button>
    </div>

  <div class="panel" id="addPanel">
    <div class="add-panel-inner">
      <input class="input title" id="add-title" placeholder="名称 *">
      <input class="input author" id="add-author" placeholder="作者（可选）">
      <select class="input" id="add-cat"></select>
      <button class="tool-btn primary small" onclick="searchItems()">🔍 搜索</button>
      <button class="tool-btn ghost small" onclick="submitAdd()">直接添加</button>
      <button class="tool-btn ghost small" onclick="toggleAdd()">收起</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="panel" id="catPanel">
    <div id="catList"></div>
    <button class="add-cat-btn" onclick="addCategory()">＋ 添加新分类</button>
  </div>

  <div class="layout">
    <div class="leftcol">
      <aside class="sidebar">
        <div class="mode-switch">
          <button class="mode-btn active" id="mode-book" onclick="switchMode('book')">📚 书籍</button>
          <button class="mode-btn" id="mode-media" onclick="switchMode('media')">🎬 影视</button>
        </div>
        <div class="side-stats">
          <div class="side-stat"><div class="num" id="stat-total">0</div><div class="label" id="stat-total-label">总书目</div></div>
          <div class="side-stat"><div class="num" id="stat-read">0</div><div class="label" id="stat-read-label">已读</div></div>
        </div>
        <div class="side-progress">
          <div class="side-progress-label"><span id="progress-label">阅读进度</span><b id="progress-pct">0%</b></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="side-actions">
          <button class="tool-btn primary" onclick="exportReport()">📤 导出报告</button>
          <button class="tool-btn ghost" onclick="exportBackup()">⬇ 导出备份</button>
          <label class="tool-btn ghost" for="import-file">⬆ 导入备份</label>
          <input type="file" id="import-file" class="sr-input" accept=".json,application/json" onchange="importBackup(this.files[0]);this.value=''">
          <button class="tool-btn ghost" onclick="resetDefault()">↺ 重置当前清单</button>
        </div>
      </aside>
    </div>
    <main class="main">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="th-f" style="width:140px"><select id="header-filter" class="th-filter" onchange="setFilter(this.value)"></select></th>
              <th class="th-plain" style="width:270px" id="th-name">书籍</th>
              <th class="th-f" style="width:120px"><select id="status-filter" class="th-filter" onchange="setStatusFilter(this.value)"></select></th>
              <th class="th-plain" style="width:140px">评分</th>
              <th class="th-plain">评语</th>
              <th class="th-plain" style="width:56px">操作</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-cover" id="detail-cover"></div>
      <div style="flex:1;min-width:0;">
        <div class="modal-title" id="detail-title"></div>
        <label class="field-label" id="author-label">作者 / 导演</label>
        <input class="author-input" id="detail-author" placeholder="填写作者或导演">
        <div class="modal-actions">
          <label class="tool-btn ghost small" for="cover-file">🖼 上传封面</label>
          <button class="tool-btn ghost small" onclick="pasteCover()">🔗 封面链接</button>
          <button class="tool-btn ghost small" id="fetch-btn" onclick="autoFetch()">✨ 自动获取</button>
          <button class="tool-btn ghost small" onclick="openDouban()">🔗 豆瓣</button>
        </div>
        <input type="file" id="cover-file" class="sr-input" accept="image/*" onchange="uploadCover(this)">
        <div class="fetch-msg" id="fetch-msg"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="tool-btn ghost" onclick="closeDetail()">取消</button>
      <button class="tool-btn primary" onclick="saveDetail()">完成</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const MODES={
  book:{ brand:'Shalis', authorLabel:'作者', statTotal:'总书目', statRead:'已读', progress:'阅读进度', colName:'书籍', addBtn:'＋ 搜索 / 添加书籍', douban:'https://search.douban.com/book/subject_search?search_text=' },
  media:{ brand:'Shalis', authorLabel:'导演', statTotal:'总片单', statRead:'已看', progress:'观看进度', colName:'影视', addBtn:'＋ 搜索 / 添加影视', douban:'https://search.douban.com/movie/subject_search?search_text=' }
};
const KEYS={ book:{ cats:'readingListCategories_v8', items:'readingListBooks_v3' }, media:{ cats:'mediaListCategories_v7', items:'mediaListItems_v1' } };
const DEFAULT_BOOK_CATEGORIES=[
  { id:'literature', name:'文学', color:'#4338CA' },{ id:'mystery', name:'推理悬疑', color:'#BE185D' },
  { id:'scifi', name:'科幻奇幻', color:'#0369A1' },{ id:'romance', name:'浪漫青春', color:'#DC4B33' },
  { id:'history', name:'历史传记', color:'#B45309' },{ id:'humanities', name:'人文社科', color:'#047857' },
  { id:'business', name:'经管励志', color:'#D97706' },{ id:'life', name:'漫画', color:'#6D28D9' },
];
const DEFAULT_MEDIA_CATEGORIES=[
  { id:'drama', name:'剧情', color:'#4338CA' },{ id:'comedy', name:'喜剧', color:'#D97706' },
  { id:'action', name:'动作', color:'#DC4B33' },{ id:'romance', name:'爱情', color:'#BE185D' },
  { id:'scifi', name:'科幻', color:'#0369A1' },{ id:'thriller', name:'悬疑', color:'#6D28D9' },
  { id:'animation', name:'动画', color:'#047857' },{ id:'doc', name:'纪录', color:'#B45309' },
];
const DEFAULT_BOOKS=[
  {id:1,cat:'mystery',title:'白夜行',author:'东野圭吾'},{id:2,cat:'mystery',title:'恶意',author:'东野圭吾'},

const STATUSES={
  book:[{key:'',label:'— 未标记 —'},{key:'want',label:'📖 想读'},{key:'reading',label:'👀 在读'},{key:'read',label:'✅ 读过'},{key:'dropped',label:'🚫 弃了'}],
  media:[{key:'',label:'— 未标记 —'},{key:'want',label:'🎬 想看'},{key:'reading',label:'👀 在看'},{key:'read',label:'✅ 看过'},{key:'dropped',label:'🚫 弃了'}]
};
const ORDER={reading:0,want:1,'':2,read:3,dropped:4};

let currentMode='book';
function defaultCats(m){return JSON.parse(JSON.stringify(m==='book'?DEFAULT_BOOK_CATEGORIES:DEFAULT_MEDIA_CATEGORIES));}
function defaultItems(m){return JSON.parse(JSON.stringify(m==='book'?DEFAULT_BOOKS:DEFAULT_MEDIA_ITEMS));}
function loadCats(m){try{const s=localStorage.getItem(KEYS[m].cats);if(s)return JSON.parse(s);}catch(e){}return defaultCats(m);}
function loadItems(m){try{const s=localStorage.getItem(KEYS[m].items);if(s)return JSON.parse(s);}catch(e){}return defaultItems(m);}
let store={ book:{items:loadItems('book'),cats:loadCats('book')}, media:{items:loadItems('media'),cats:loadCats('media')} };
let currentFilter='all', currentStatusFilter='all', editId=null, searchResults=[];

function items(){return store[currentMode].items;}
function cats(){return store[currentMode].cats;}
function setItems(a){store[currentMode].items=a;}
function setCats(a){store[currentMode].cats=a;}
function saveItems(){localStorage.setItem(KEYS[currentMode].items,JSON.stringify(store[currentMode].items));}
function saveCats(){localStorage.setItem(KEYS[currentMode].cats,JSON.stringify(store[currentMode].cats));}
function saveAll(){localStorage.setItem(KEYS.book.items,JSON.stringify(store.book.items));localStorage.setItem(KEYS.book.cats,JSON.stringify(store.book.cats));localStorage.setItem(KEYS.media.items,JSON.stringify(store.media.items));localStorage.setItem(KEYS.media.cats,JSON.stringify(store.media.cats));}
function statuses(){return STATUSES[currentMode];}
function findBook(id){return items().find(b=>b.id==id);}
function findCat(id){return cats().find(c=>c.id===id);}
function getCatObj(id){return findCat(id)||cats()[0];}
function escapeHtml(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function imgError(el){el.outerHTML='<div class="cover-placeholder">📕</div>';}
function coverInner(b){return b.cover?`<img src="${escapeHtml(b.cover)}" onerror="imgError(this)">`:'<div class="cover-placeholder">📕</div>';}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

function exportBackup(){
  const data={app:'reading-list',version:1,book:{items:store.book.items,cats:store.book.cats},media:{items:store.media.items,cats:store.media.cats}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`书单备份_${new Date().toISOString().slice(0,10)}.json`;a.click();
  toast('✓ 备份已导出');
}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(d.book&&Array.isArray(d.book.items)){store.book.items=d.book.items;store.book.cats=Array.isArray(d.book.cats)?d.book.cats:defaultCats('book');}
    if(d.media&&Array.isArray(d.media.items)){store.media.items=d.media.items;store.media.cats=Array.isArray(d.media.cats)?d.media.cats:defaultCats('media');}
    sanitizeMode('book');sanitizeMode('media');saveAll();renderAll();toast('✓ 导入成功');
  }catch(err){alert('备份文件格式不对哦～');}};
  r.readAsText(file);
}
function sanitizeMode(m){const cs=store[m].cats,ids=new Set(cs.map(c=>c.id));store[m].items.forEach(b=>{if(!ids.has(b.cat))b.cat=cs[0].id;});}
function switchMode(mode){
  if(mode===currentMode)return;currentMode=mode;currentFilter='all';currentStatusFilter='all';editId=null;
  document.getElementById('addPanel').classList.remove('show');document.getElementById('catPanel').classList.remove('show');document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('mode-book').classList.toggle('active',mode==='book');document.getElementById('mode-media').classList.toggle('active',mode==='media');
  sanitizeMode(mode);renderAll();
}
function updateModeLabels(){
  const m=MODES[currentMode];
  document.getElementById('brand-title').innerHTML=m.brand;
  document.getElementById('stat-total-label').textContent=m.statTotal;
  document.getElementById('stat-read-label').textContent=m.statRead;
  document.getElementById('progress-label').textContent=m.progress;
  document.getElementById('th-name').textContent=m.colName;
  document.getElementById('add-author').placeholder=m.authorLabel+'（可选）';
  document.getElementById('add-toggle-btn').textContent=m.addBtn;
}
const PALETTE=['#4338CA','#0369A1','#BE185D','#B45309','#047857','#6D28D9','#0C86AD','#DC4B33','#D97706','#7E22CE','#0E7490','#A21CAF'];
function pickColor(){const u=new Set(cats().map(c=>c.color));for(const c of PALETTE){if(!u.has(c))return c;}return PALETTE[cats().length%PALETTE.length];}
function toggleCatManager(){const p=document.getElementById('catPanel');p.classList.toggle('show');if(p.classList.contains('show'))renderCatManager();}
function renderCatManager(){
  document.getElementById('catList').innerHTML=cats().map(c=>{
    const n=items().filter(b=>b.cat===c.id).length;
    return `<div class="cat-item"><input type="color" class="cat-color" value="${c.color}" onchange="updateCatColor('${c.id}',this.value)"><input class="cat-name" value="${escapeHtml(c.name)}" onchange="updateCatName('${c.id}',this.value)"><span class="cat-count">${n} 个</span><button class="del-btn" onclick="deleteCategory('${c.id}')">✕</button></div>`;
  }).join('');
}
function addCategory(){cats().push({id:'c'+Date.now(),name:'新分类',color:pickColor()});saveCats();renderAll();}
function updateCatName(id,v){const c=findCat(id);if(!c)return;v=v.trim();c.name=v||c.name;saveCats();renderAll();}
function updateCatColor(id,v){const c=findCat(id);if(!c)return;c.color=v;saveCats();renderTable();renderCatManager();renderAddCatSelect();}
function deleteCategory(id){
  if(cats().length<=1){alert('至少保留一个分类哦～');return;}
  const cat=findCat(id),n=items().filter(b=>b.cat===id).length,t=cats().filter(c=>c.id!==id)[0];
  if(!confirm(`删除「${cat.name}」？${n?`其中 ${n} 本将移到「${t.name}」。`:''}`))return;
  items().forEach(b=>{if(b.cat===id)b.cat=t.id;});
  setCats(cats().filter(c=>c.id!==id));if(currentFilter===id)currentFilter='all';
  saveCats();saveItems();renderAll();
}
function renderFilterSelect(){const s=document.getElementById('header-filter');let h=`<option value="all">全部分类</option>`;cats().forEach(c=>h+=`<option value="${c.id}">${escapeHtml(c.name)}</option>`);s.innerHTML=h;s.value=currentFilter;if(s.value!==currentFilter)s.value='all';}
function renderStatusFilterSelect(){const s=document.getElementById('status-filter');let h=`<option value="all">全部状态</option>`;statuses().forEach(x=>{if(x.key)h+=`<option value="${x.key}">${x.label}</option>`;});s.innerHTML=h;s.value=currentStatusFilter;if(s.value!==currentStatusFilter)s.value='all';}
function renderAddCatSelect(){document.getElementById('add-cat').innerHTML=cats().map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');}
function setFilter(v){currentFilter=v;renderTable();}
function setStatusFilter(v){currentStatusFilter=v;renderTable();}

function fetchT(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t));}
const PROXIES=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
async function searchDouban(q){
  const target=(currentMode==='book'?'https://book.douban.com/j/subject_suggest?q=':'https://movie.douban.com/j/subject_suggest?q=')+encodeURIComponent(q);
  for(const p of PROXIES){try{const r=await fetchT(p(target),6000);const d=await r.json();
    if(Array.isArray(d)&&d.length)return d.filter(x=>x.title).map(x=>({source:'douban',title:x.title,author:'',year:'',cover:x.pic?('https://images.weserv.nl/?url='+encodeURIComponent(x.pic.replace(/^https?:\/\//,''))):''}));
  }catch(e){}}
  return [];
}
async function searchOpenLibrary(q){
  const r=await fetchT('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=6&fields=key,title,author_name,cover_i,first_publish_year');
  const d=await r.json();if(!d.docs||!d.docs.length)return[];
  return d.docs.filter(x=>x.title).map(x=>({source:'ol',title:x.title,author:(x.author_name&&x.author_name[0])||'',year:(x.first_publish_year||''),cover:x.cover_i?('https://covers.openlibrary.org/b/id/'+x.cover_i+'-M.jpg'):''}));
}
async function searchGoogleSearch(q){
  const r=await fetchT('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=6&printType=books');
  const d=await r.json();if(!d.items||!d.items.length)return[];
  return d.items.map(it=>{const v=it.volumeInfo||{};let t=(v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail))||'';if(t)t=t.replace('http://','https://');return{source:'gb',title:v.title||'',author:(v.authors&&v.authors[0])||'',year:(v.publishedDate||'').slice(0,4),cover:t};}).filter(x=>x.title);
}
async function searchItunes(q){
  const r=await fetchT('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=movie&limit=6');
  const d=await r.json();if(!d.results||!d.results.length)return[];
  return d.results.filter(x=>x.trackName).map(x=>({source:'itunes',title:x.trackName,author:x.artistName||'',year:(x.releaseDate||'').slice(0,4),cover:(x.artworkUrl100||'').replace('100x100','300x300')}));
}
async function doSearch(q){
  let r=[];try{r=await searchDouban(q);}catch(e){}
  if(!r.length){try{r=await searchOpenLibrary(q);}catch(e){}}
  if(!r.length){if(currentMode==='book'){try{r=await searchGoogleSearch(q);}catch(e){}}else{try{r=await searchItunes(q);}catch(e){}}}
  return r;
}

async function searchItems(){
  const title=document.getElementById('add-title').value.trim(),author=document.getElementById('add-author').value.trim();
  if(!title&&!author){alert('请输入名称，或'+MODES[currentMode].authorLabel+'哦～');return;}
  const q=(title+' '+author).trim(),box=document.getElementById('searchResults');
  box.innerHTML='<div class="search-loading">🔍 正在搜索…</div>';searchResults=[];
  let f=[];try{f=await doSearch(q);}catch(e){}
  if(!f.length){box.innerHTML=`<div class="search-empty">没搜到《${escapeHtml(title||author)}》😢<br>国内网络无法直连外网书源；<br>可「直接添加」后，点封面补作者/封面～</div>`;return;}
  searchResults=f;
  box.innerHTML=f.map((it,i)=>`<div class="result-card"><div class="result-cover">${it.cover?`<img src="${escapeHtml(it.cover)}" onerror="imgError(this)">`:'<div class="cover-placeholder">📕</div>'}</div><div class="result-info"><div class="result-title">${escapeHtml(it.title)}</div><div class="result-author">${escapeHtml(it.author||'')}${it.year?(' · '+it.year):''}</div></div><button class="tool-btn primary small" onclick="addFromResult(${i})">加入</button></div>`).join('');
}
async function addFromResult(i){
  const it=searchResults[i];if(!it)return;
  const cat=document.getElementById('add-cat').value;
  items().unshift({id:Date.now(),title:it.title,author:it.author||'',cat,cover:it.cover||'',rating:0,status:'',comment:''});
  saveItems();renderTable();
  document.getElementById('add-title').value='';document.getElementById('add-author').value='';document.getElementById('searchResults').innerHTML='';searchResults=[];
  toast('✓ 已加入：《'+it.title+'》');
}

function renderTable(){
  const body=document.getElementById('table-body');
  let list=items().slice();
  if(currentFilter!=='all')list=list.filter(b=>b.cat===currentFilter);
  if(currentStatusFilter!=='all')list=list.filter(b=>b.status===currentStatusFilter);
  list.sort((a,b)=>(ORDER[a.status]??2)-(ORDER[b.status]??2));
  if(!list.length){body.innerHTML=`<tr><td colspan="6"><div class="empty-tip">暂无内容～点「搜索 / 添加」加一个 🌱</div></td></tr>`;updateStats();return;}
  body.innerHTML=list.map(book=>{
    const co=getCatObj(book.cat);
    const catOpts=cats().map(c=>`<option value="${c.id}" ${c.id===book.cat?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
    const stars=[1,2,3,4,5].map(n=>`<span class="star ${n<=book.rating?'filled':''}" onclick="clickStar(${book.id},${n})">★</span>`).join('');
    const stOpts=statuses().map(s=>`<option value="${s.key}" ${book.status===s.key?'selected':''}>${s.label}</option>`).join('');
    return `<tr class="${book.status==='dropped'?'dropped':''}">
      <td data-label="分类"><select class="cat-select" style="background-color:${co.color}14;color:${co.color};border-color:${co.color}40" onchange="setCat(${book.id},this.value)">${catOpts}</select></td>
      <td class="no-label"><div class="book-cell"><div class="cover-thumb" onclick="openDetail(${book.id})">${coverInner(book)}</div><div class="book-info"><div class="book-title" onclick="openDetail(${book.id})">《${escapeHtml(book.title)}》</div><div class="book-author">${escapeHtml(book.author||'')}</div></div></div></td>
      <td data-label="状态"><select class="status-select st-${book.status}" onchange="setStatus(${book.id},this.value)">${stOpts}</select></td>
      <td data-label="评分"><div class="stars">${stars}</div><span class="rating-num">${book.rating?book.rating+'.0':'未评'}</span></td>
      <td class="td-comment" data-label="评语"><textarea class="comment-box" placeholder="写点感想…" oninput="onComment(${book.id},this)">${escapeHtml(book.comment||'')}</textarea><div class="save-hint" id="hint-${book.id}"></div></td>
      <td class="td-op no-label"><button class="del-btn" onclick="deleteItem(${book.id})">✕</button></td>
    </tr>`;
  }).join('');
  updateStats();
}
function clickStar(id,n){const b=findBook(id);b.rating=(b.rating===n)?0:n;saveItems();renderTable();}
function setStatus(id,v){const b=findBook(id);b.status=v;saveItems();renderTable();}
function setCat(id,v){const b=findBook(id);b.cat=v;saveItems();renderTable();}
let timers={};
function onComment(id,el){const b=findBook(id);b.comment=el.value;const h=document.getElementById(`hint-${id}`);if(h)h.textContent='输入中…';clearTimeout(timers[id]);timers[id]=setTimeout(()=>{saveItems();if(h){h.textContent='✓ 已保存';setTimeout(()=>h.textContent='',1200);}},600);}
function toggleAdd(){const p=document.getElementById('addPanel');p.classList.toggle('show');if(p.classList.contains('show'))document.getElementById('add-title').focus();}
function submitAdd(){
  const t=document.getElementById('add-title').value.trim(),a=document.getElementById('add-author').value.trim(),c=document.getElementById('add-cat').value;
  if(!t){alert('请填写名称哦～');return;}
  items().unshift({id:Date.now(),title:t,author:a,c,rating:0,status:'',comment:'',cover:''});
  saveItems();renderTable();
  document.getElementById('add-title').value='';document.getElementById('add-author').value='';document.getElementById('searchResults').innerHTML='';
  toast('✓ 已添加：《'+t+'》（点封面可补'+MODES[currentMode].authorLabel+'）');
}
function deleteItem(id){const b=findBook(id);if(!b)return;if(confirm(`删除《${b.title}》？`)){setItems(items().filter(x=>x.id!=id));saveItems();renderTable();}}
function openDetail(id){
  editId=id;const b=findBook(id);if(!b)return;
  document.getElementById('detail-cover').innerHTML=coverInner(b);
  document.getElementById('detail-title').textContent='《'+b.title+'》';
  document.getElementById('author-label').textContent=MODES[currentMode].authorLabel+'（可修改）';
  document.getElementById('detail-author').value=b.author||'';
  document.getElementById('fetch-msg').textContent='';
  document.getElementById('modal-overlay').classList.add('show');
}
function closeDetail(){document.getElementById('modal-overlay').classList.remove('show');editId=null;}
function saveDetail(){
  const b=findBook(editId);if(!b)return;
  b.author=document.getElementById('detail-author').value.trim();
  saveItems();renderTable();closeDetail();
  toast('✓ 已保存');
}
function updateModalCover(b){document.getElementById('detail-cover').innerHTML=coverInner(b);}
function setFetchMsg(m){document.getElementById('fetch-msg').textContent=m;}
function pasteCover(){
  const b=findBook(editId);if(!b)return;
  const u=prompt('粘贴封面图片链接：');if(!u)return;
  let url=u.trim();
  if(/doubanio\.com|douban\.com/.test(url))url='https://images.weserv.nl/?url='+encodeURIComponent(url.replace(/^https?:\/\//,''));
  b.cover=url;saveItems();updateModalCover(b);renderTable();setFetchMsg('✓ 封面已设置');
}
function uploadCover(input){
  const f=input.files[0];if(!f||!editId)return;
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{const mw=320;let w=img.width,h=img.height;if(w>mw){h=Math.round(h*mw/w);w=mw;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const b=findBook(editId);b.cover=c.toDataURL('image/jpeg',0.82);saveItems();updateModalCover(b);renderTable();setFetchMsg('✓ 封面已上传');};img.src=e.target.result;};
  r.readAsDataURL(f);input.value='';
}
async function autoFetch(){
  const b=findBook(editId);if(!b)return;
  const btn=document.getElementById('fetch-btn');btn.disabled=true;btn.textContent='获取中…';setFetchMsg('正在搜索…');
  const q=(b.title+' '+(b.author||'')).trim();let f=[];try{f=await doSearch(q);}catch(e){}
  if(f.length){const it=f[0];if(it.cover)b.cover=it.cover;if(it.author)b.author=it.author;saveItems();updateModalCover(b);document.getElementById('detail-author').value=b.author||'';renderTable();setFetchMsg('✓ 已获取封面');}
  else setFetchMsg('国内无法直连外网书源，请用「上传封面/封面链接」～');
  btn.disabled=false;btn.textContent='✨ 自动获取';
}
function openDouban(){const b=findBook(editId);if(!b)return;window.open(MODES[currentMode].douban+encodeURIComponent(b.title),'_blank');}
function updateStats(){const t=items().length;let r=0;items().forEach(b=>{if(b.status==='read')r++;});document.getElementById('stat-total').textContent=t;document.getElementById('stat-read').textContent=r;const p=t?Math.round(r/t*100):0;document.getElementById('progress-fill').style.width=p+'%';document.getElementById('progress-pct').textContent=p+'%';}
function exportReport(){
  const m=MODES[currentMode];let L=['【我的'+m.colName+'报告】','',`总数：${items().length}`,'','————————————',''];
  cats().forEach(cat=>{const list=items().filter(b=>b.cat===cat.id);if(!list.length)return;L.push(`◆ ${cat.name}`);
    list.forEach(b=>{const st=b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating):'未评分';const s=statuses().find(x=>x.key===b.status)?.label||'未标记';L.push(`  《${b.title}》 ${b.author||''} | ${s} | ${st}`);if(b.comment)L.push(`    评语：${b.comment.replace(/\n/g,' ')}`);});L.push('');});
  const blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`我的${m.colName}报告.txt`;a.click();
}
function resetDefault(){const m=MODES[currentMode];if(confirm(`重置「${m.colName}」默认清单？你的添加与修改将被清除。`)){store[currentMode].items=defaultItems(currentMode);store[currentMode].cats=defaultCats(currentMode);currentFilter='all';currentStatusFilter='all';saveItems();saveCats();renderAll();}}
function renderAll(){renderFilterSelect();renderStatusFilterSelect();renderAddCatSelect();renderCatManager();renderTable();updateModeLabels();}
sanitizeMode('book');sanitizeMode('media');renderAll();
</script>
